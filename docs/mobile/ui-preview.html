<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subwise 移动 UI 评审</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8edf5;color:#182640;font:15px 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:0;background:transparent;color:inherit}button:focus-visible{outline:3px solid #315dcc}aside{max-width:900px;margin:24px auto;padding:0 24px}aside p{color:#53617a;line-height:1.7}.phone{width:min(100%,390px);margin:24px auto;background:#f6f8fc;border:1px solid #dce3ef;border-radius:32px;overflow:hidden;box-shadow:0 20px 60px #18264018}.status{padding:18px 24px 10px;display:flex;justify-content:space-between;font-weight:600}.bar{padding:12px 24px;background:#e8eefc;color:#315dcc;font-size:12px}main{padding:24px;min-height:580px}h1{font-size:27px;margin:4px 0 24px}h2{font-size:17px;margin:26px 0 14px}p{line-height:1.6}.muted,small{color:#65738b}small{font-size:12px}.hero{background:#244ba9;color:white;border-radius:20px;padding:22px}.hero small{color:#d3dffc}.amount{font-size:40px;font-weight:650;margin:10px 0;font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:17px 0;border-bottom:1px solid #dce3ef}.row span:nth-child(2){flex:1}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#e8eefc;color:#315dcc;font-weight:700}.card{background:white;border-radius:16px;padding:18px;margin:12px 0}.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}progress{width:100%;height:8px;accent-color:#315dcc;margin:14px 0 8px}nav{display:flex;border-top:1px solid #dce3ef;background:white;padding:10px 8px 22px}nav button{flex:1;font-size:13px}nav .active{color:#315dcc;background:#e8eefc;border-radius:12px}.primary{background:#315dcc;color:white;border-radius:12px;padding:12px 18px}.wide{width:100%;margin-top:18px}.tag{font-size:11px;color:#986017;background:#fff3dd;padding:5px 8px;border-radius:6px}input,select{width:100%;padding:13px;margin:8px 0 18px;border:1px solid #dce3ef;border-radius:10px;background:white}label{display:block}.note{padding:12px 0;font-size:12px;color:#65738b}@media(max-width:500px){aside{margin:12px auto}.phone{margin:0 auto;border-radius:0;border:0;box-shadow:none}}
</style><aside><b>Subwise / 移动 App 设计评审 V1</b><p>iOS · Android · HarmonyOS　｜　示例数据，非真实账户<br>四个导航可点击；新增订阅仅演示本次会话，不保存。</p><button onclick="offline=!offline;render()">切换联网 / 离线</button><button onclick="empty=!empty;render()">切换空状态</button></aside><div class="phone"><div class="status"><span>9:41</span><span>▰ ▰ ▰</span></div><div class="bar" id="banner"></div><main id="screen"></main><nav id="nav"></nav></div><script>
let page='总览',offline=false,empty=false,selected='MiniMax',added=[];
const names=['MiniMax','Claude','DeepSeek'];
const data={MiniMax:['M Plan · 月付','¥ 98','11月02日'],Claude:['Pro · 月付','$ 20','11月12日'],DeepSeek:['API · 按量付费','余额 ¥ 42.80','无自动续费']};
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(p){page=p;render()}function detail(n){selected=n;go('详情')}
function rows(){return names.map(n=>`<button class="row" onclick="detail('${n}')"><span class="logo">${n[0]}</span><span><b>${n}</b><br><small>${data[n][0]}</small></span><span>${data[n][1]}<br><small>${data[n][2]}</small></span></button>`).join('')+added.map(n=>`<div class="row"><span class="logo">＋</span><span><b>${esc(n)}</b><br><small>手动订阅 · 待补全</small></span></div>`).join('')}
function usage(){return `<div class="card"><div class="spread"><b>MiniMax</b><small>示例快照</small></div><p>5 小时窗口 <b style="float:right">已用 68%</b></p><progress max="100" value="68"></progress><small>剩余 32% · 14:30 重置（示例）</small><p>每周窗口 <b style="float:right">已用 41%</b></p><progress max="100" value="41"></progress><small>各窗口独立计算</small></div><div class="card"><div class="spread"><b>DeepSeek</b><small>账户余额</small></div><div class="amount">¥ 42.80</div><small>余额不代表剩余 Token 数</small></div><div class="card"><div class="spread"><b>Claude Pro</b><span class="tag">未记录</span></div><p class="muted">尚无用量记录</p><button class="primary" onclick="go('手动记录')">手动记录用量</button></div><p class="note">示例更新时间：2026-10-29 09:30<br>真实平台接入能力将在开发前核验。</p>`}
function render(){document.getElementById('banner').textContent=offline?'离线 · 正在查看本机记录 · 10月29日 09:30':'设计预览 · 所有金额与用量均为示例';let s=`<h1>${page}</h1>`;
if(empty&&['总览','订阅','用量'].includes(page))s+='<div class="card"><h2>从第一项订阅开始</h2><p class="muted">记录你的 AI 平台、续费日期与费用。离线也能管理。</p><button class="primary wide" onclick="go(\'添加订阅\')">添加订阅</button></div>';
else if(page==='总览')s=`<div class="spread"><small>10月29日，星期四</small><small>本机空间</small></div><h1>我的 AI 订阅</h1><div class="hero"><small>每月固定订阅支出 · 按币种</small><div class="amount">¥ 98 <span style="font-size:20px">+ $ 20</span></div><small>2 项周期订阅 · 不含按量消费</small></div><h2>下一次续费</h2><button class="row" onclick="detail('MiniMax')"><span class="logo">02<br>11月</span><span><b>MiniMax M Plan</b><br><small>4 天后 · 月付</small></span><b>¥ 98</b></button><h2>用量速览</h2><div class="card"><div class="spread"><b>MiniMax · 5 小时</b><span>已用 68%</span></div><progress max="100" value="68"></progress><div class="spread"><small>09:30 示例快照</small><button onclick="go('用量')">查看用量 ›</button></div></div><button class="primary wide" onclick="go('添加订阅')">＋ 添加订阅</button>`;
else if(page==='订阅')s+=rows()+'<button class="primary wide" onclick="go(\'添加订阅\')">＋ 添加订阅</button>';
else if(page==='用量')s+=usage();
else if(page==='我的')s+='<div class="card"><b>数据保存在此设备</b><p class="muted">无需登录即可管理订阅。</p></div>'+['续费提醒','备份与恢复','平台连接','外观与显示'].map(n=>`<button class="row" onclick="go('${n}')"><span>${n}</span><span>›</span></button>`).join('');
else if(page==='详情')s=`<button onclick="go('订阅')">‹ 订阅</button><h1>${selected}</h1><div class="hero"><small>${data[selected][0]}</small><div class="amount">${data[selected][1]}</div><small>下次续费：${data[selected][2]}</small></div><h2>订阅记录</h2><p>记录状态：使用中</p><p class="muted">提醒：提前 3 天（设计示例）</p><button class="primary wide" onclick="go('用量')">查看用量</button><p class="note">归档与编辑、通知权限流程将在实现规格中细化。</p>`;
else if(page==='添加订阅')s+=`<form onsubmit="event.preventDefault();added.push(document.getElementById('name').value);empty=false;go('订阅')"><label>平台名称<input id="name" required maxlength="40" placeholder="例如：Gemini"></label><label>订阅类型<select><option>月付订阅</option><option>年付订阅</option><option>API 按量付费</option></select></label><p class="muted">这是添加流程预览，价格与日期字段将在正式设计细化。</p><button class="primary wide">添加到预览</button></form>`;
else if(page==='手动记录')s+='<p class="muted">记录当前平台页面显示的用量。正式版本将支持数值、单位、统计窗口及记录时间。</p><button class="primary" onclick="go(\'用量\')">返回用量</button>';
else s+='<div class="card"><p>'+({'续费提醒':'提前 3 天提醒。正式版本需系统通知授权；拒绝后仍保留应用内提醒。','备份与恢复':'导出本机记录；恢复前预览并确认。默认不包含平台凭据。','平台连接':'区分未连接、已连接和授权失效；无可用接口时使用手动记录。','外观与显示':'跟随系统主题与文字大小。此稿展示浅色方案。'}[page]||'')+'</p><small>说明页，尚未实现设备功能。</small></div><button onclick="go(\'我的\')">‹ 返回</button>';
document.getElementById('screen').innerHTML=s;document.getElementById('nav').innerHTML=['总览','订阅','用量','我的'].map((n,i)=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${['◫','▤','◴','○'][i]}<br>${n}</button>`).join('')}
render();</script></html>
